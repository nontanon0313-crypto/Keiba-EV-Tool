<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#D4AF37">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./theme.css">
<title>Keiba-EV-Tool</title>
</head>
<body>
<div id="__err" style="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#800;color:#fff;font-size:10px;padding:3px;word-break:break-all;display:none;"></div>
<script>window.onerror=function(m,src,l,c,e){var d=document.getElementById("__err");if(d){d.style.display="block";d.textContent="ERR: "+m+" @"+l+":"+c;}}</script>

<header>
<h1>Keiba EV Tool</h1>
<nav class="tabs">
<button class="tab active" data-tab="predict" type="button">予想</button>
<button class="tab" data-tab="analytics" type="button">検証</button>
<button class="tab" data-tab="bets" type="button">収益</button>
<button class="tab" data-tab="horse" type="button">馬</button>
<button class="tab" data-tab="jockey" type="button">騎手</button>
<button class="tab" data-tab="pedigree" type="button">血統</button>
<button class="tab" data-tab="past" type="button">過去</button>
<button id="settings-btn" class="gear-tab" type="button" aria-label="詳細設定">詳細設定</button>
</nav>
</header>
<main>
<section id="tab-predict">
<section id="races">
<h2>本日のレース</h2>
<div id="race-list">読み込み中...</div>
</section>
<section id="detail" hidden>
<button id="back-btn" type="button">← 戻る</button>
<div class="subtabs" id="ticket-tabs">
<button class="subtab active" data-ticket="mixed" type="button">推奨</button>
<button class="subtab" data-ticket="quinella" type="button">馬連</button>
<button class="subtab" data-ticket="trio" type="button">3連複</button>
<button class="subtab" data-ticket="wide" type="button">ワイド</button>
<button class="subtab" data-ticket="trifecta" type="button">3連単</button>
<button class="subtab" data-ticket="exacta" type="button">馬単</button>
<button class="subtab" data-ticket="win" type="button">単勝</button>
<button class="subtab" data-ticket="place" type="button">複勝</button>
</div>
<h2 id="detail-title">レース詳細</h2>
<div id="detail-body"></div>
</section>
</section>
<section id="tab-analytics" hidden>
<div class="subtabs" id="ana-scope-tabs">
<button class="subtab active" data-ana-scope="all_combos" type="button">全体</button>
<button class="subtab" data-ana-scope="all" type="button">投票条件フィルタ</button>
<button class="subtab" data-ana-scope="plan" type="button">実投票</button>
<button class="subtab" data-ana-scope="non_plan" type="button">投票除外</button>
</div>
<div id="ana-summary" class="summary"></div>
<div class="model-filter-row">
<label class="model-filter">モデル版<select id="ana-model-filter"><option value="">すべて</option></select></label>
</div>
<div class="subtabs" id="ana-view-tabs">
<button class="subtab active" data-view="ev" type="button">期待値</button>
<button class="subtab" data-view="prob" type="button">確率</button>
<button class="subtab" data-view="odds" type="button">オッズ</button>
<button class="subtab" data-view="features" type="button">出走表</button>
<button class="subtab" data-view="tickets" type="button">券種比較</button>
<button class="subtab" data-view="single_features" type="button">単独特徴</button>
<button class="subtab" data-view="feature_single" type="button">単一特徴</button>
<button class="subtab" data-view="feature_interactions" type="button">特徴交互作用</button>
<button class="subtab" data-view="model_params" type="button">予想モデル</button>
<button class="subtab" data-view="condition_deviation" type="button">条件別乖離</button>
<button class="subtab" data-view="venue_stats" type="button">会場統計</button>
<button class="subtab" data-view="multi" type="button">券種別検証</button>
</div>
<div id="ana-view">読み込み中...</div>
</section>
<section id="tab-bets" hidden>
<h2>収益サマリ</h2>
<div id="storage-badge" class="storage-badge">DB: ...</div>
<div id="bets-summary">読み込み中...</div>
<h2>資産推移</h2>
<div class="chart-wrap"><canvas id="curve-chart" width="640" height="320"></canvas></div>
<h2>投票履歴</h2>
<div class="row-actions">
<button id="settle-all-zero" class="bulk-btn inline" type="button">未確定を全件0円で確定</button>
<button id="export-bets" class="bulk-btn inline" type="button">バックアップ</button>
<label class="bulk-btn inline" for="import-bets">復元</label>
<input id="import-bets" type="file" accept="application/json,.json" hidden>
</div>
<div id="bets-list">読み込み中...</div>
</section>
<section id="tab-horse" hidden>
<h2>馬</h2>
<div id="horse-list-view">
<div class="filters">
<label>馬名 or 馬ID<input id="horse-id" type="text" placeholder="例: フークサプライズ / 2019100959"></label>
</div>
<button id="horse-load" class="bulk-btn" type="button">検索</button>
<div id="horse-search-result"></div>
</div>
<div id="horse-detail-view" hidden>
<button id="horse-back" type="button">← 戻る</button>
<div id="horse-detail-title"></div>
<div class="subtabs" id="horse-view-tabs" hidden>
<button class="subtab active" data-hv="basic" type="button">基本</button>
<button class="subtab" data-hv="history" type="button">走歴</button>
<button class="subtab" data-hv="distance" type="button">距離別</button>
<button class="subtab" data-hv="surface_cond" type="button">馬場別</button>
<button class="subtab" data-hv="venue" type="button">会場別</button>
<button class="subtab" data-hv="style" type="button">脚質</button>
<button class="subtab" data-hv="recent" type="button">近走</button>
<button class="subtab" data-hv="pedigree" type="button">血統</button>
</div>
<div id="horse-view"></div>
</section>
<section id="tab-past" hidden>
<h2>過去レース</h2>
<div class="filters">
<label>開始日<input id="past-date-from" type="date"></label>
<label>終了日<input id="past-date-to" type="date"></label>
<label>会場<select id="past-venue"><option value="">すべて</option></select></label>
</div>
<button id="past-search" class="bulk-btn" type="button">検索</button>
<div id="past-result"></div>
<div id="past-detail" hidden>
<button id="past-back" type="button">← 戻る</button>
<div id="past-detail-body"></div>
</div>
</section>
<section id="tab-jockey" hidden>
<h2>騎手</h2>
<div class="filters">
<label>騎手名<input id="jockey-search" type="text" placeholder="例: 宮下瞳"></label>
</div>
<button id="jockey-load" class="bulk-btn" type="button">検索</button>
<div id="jockey-result"></div>
<div id="jockey-view"></div>
</section>
<section id="tab-pedigree" hidden>
<h2>血統</h2>
<div class="filters">
<label>種別<select id="ped-kind"><option value="sire">父</option><option value="dam_sire">母父</option></select></label>
<label>名前<input id="ped-name" type="text" placeholder="例: ステイゴールド"></label>
</div>
<button id="ped-search" class="bulk-btn" type="button">検索</button>
<div id="ped-list"></div>
<div id="ped-detail" hidden>
<button id="ped-back" type="button">← 戻る</button>
<div id="ped-detail-body"></div>
</div>
</section>
</main>
<div id="settings-modal" class="modal" hidden>
<div class="modal-content">
<h2>詳細設定</h2>
<div class="filters">
<label>最低確率 %<input id="f-minprob" type="number" step="0.1" value="0"></label>
<label>最低オッズ<input id="f-minodds" type="number" step="0.1" value="0"></label>
<label>証拠金<input id="f-collateral" type="number" step="1000" value="100000"></label>
<label>上限投資<input id="f-maxinv" type="number" step="1000" value="10000"></label>
<label>賭け金モード<select id="f-betmode">
<option value="compound">複利（資金×0.5%）</option>
<option value="fixed">固定額</option>
</select></label>
<label>固定額（円）<input id="f-betunit" type="number" step="100" value="500"></label>
</div>
<p class="hint">値は localStorage に保存され、次回起動時も適用されます。</p>
<button id="settings-close" class="bulk-btn" type="button">閉じる</button>
</div>
</div>
<script src="./ev-theme.js"></script>
<script src="./app.js?v=106"></script>
</body>
</html>
