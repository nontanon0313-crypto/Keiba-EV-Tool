<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#D4AF37">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./theme.css">
<title>Keiba-EV-Tool</title>
</head>
<body>
<header>
<h1>Keiba EV Tool</h1>
<button id="settings-btn" class="gear" type="button" aria-label="設定">⚙</button>
<nav class="tabs">
<button class="tab active" data-tab="predict" type="button">予想</button>
<button class="tab" data-tab="analytics" type="button">検証</button>
<button class="tab" data-tab="bets" type="button">収益</button>
</nav>
</header>
<main>
<section id="tab-predict">
<div class="filters">
<label>最低確率 %<input id="f-minprob" type="number" step="0.1" value="0"></label>
<label>最低オッズ<input id="f-minodds" type="number" step="0.1" value="0"></label>
<label>証拠金<input id="f-collateral" type="number" step="1000" value="100000"></label>
<label>上限投資<input id="f-maxinv" type="number" step="1000" value="10000"></label>
</div>
<section id="races">
<h2>本日のレース</h2>
<div id="race-list">読み込み中...</div>
</section>
<section id="detail" hidden>
<button id="back-btn" type="button">← 戻る</button>
<div class="subtabs" id="ticket-tabs">
<button class="subtab active" data-ticket="trifecta" type="button">3連単</button>
<button class="subtab" data-ticket="trio" type="button">3連複</button>
<button class="subtab" data-ticket="exacta" type="button">馬単</button>
<button class="subtab" data-ticket="quinella" type="button">馬連</button>
<button class="subtab" data-ticket="wide" type="button">ワイド</button>
<button class="subtab" data-ticket="win" type="button">単勝</button>
<button class="subtab" data-ticket="place" type="button">複勝</button>
</div>
<h2 id="detail-title">レース詳細</h2>
<div id="detail-body"></div>
</section>
</section>
<section id="tab-analytics" hidden>
<div class="subtabs" id="ana-scope-tabs">
<button class="subtab active" data-scope="all" type="button">全体</button>
<button class="subtab" data-scope="voted" type="button">投票</button>
<button class="subtab" data-scope="excluded" type="button">除外</button>
</div>
<div id="ana-summary" class="summary"></div>
<div class="subtabs" id="ana-view-tabs">
<button class="subtab active" data-view="ev" type="button">期待値</button>
<button class="subtab" data-view="prob" type="button">確率</button>
<button class="subtab" data-view="odds" type="button">オッズ</button>
<button class="subtab" data-view="features" type="button">出走表</button>
</div>
<div id="ana-view">読み込み中...</div>
</section>
<section id="tab-bets" hidden>
<h2>収益サマリ</h2>
<div id="bets-summary">読み込み中...</div>
<h2>資産推移</h2>
<div class="chart-wrap"><canvas id="curve-chart" width="640" height="320"></canvas></div>
<h2>投票履歴</h2>
<div id="bets-list">読み込み中...</div>
</section>
</main>
<div id="settings-modal" class="modal" hidden>
<div class="modal-content">
<h2>詳細設定</h2>
<div class="filters">
<label>最低確率 %<input id="f-minprob" type="number" step="0.1" value="0"></label>
<label>最低オッズ<input id="f-minodds" type="number" step="0.1" value="0"></label>
<label>証拠金<input id="f-collateral" type="number" step="1000" value="100000"></label>
<label>上限投資<input id="f-maxinv" type="number" step="1000" value="10000"></label>
</div>
<p class="hint">値は localStorage に保存され、次回起動時も適用されます。</p>
<button id="settings-close" class="bulk-btn" type="button">閉じる</button>
</div>
</div>
<script src="./ev-theme.js"></script>
<script src="./app.js"></script>
</body>
</html>
