[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [".venv", "node_modules", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E401", "E701", "E702", "E741", "E722", "F401", "F403", "F405", "F841", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
mypy_path = "."
exclude = ["\\.venv", "node_modules", "frontend"]
